name: assurance

# T3 (#516): the expensive race assurance, across the whole module. It is not a
# merge gate; it runs nightly, on request, and on a pull request that changes
# this file. High-risk domains already escalate their own tests to -race in T1
# (see ci/evidence/registry.json); this is the sweep that covers the rest.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/assurance.yml"

permissions:
  contents: read

jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Race
        run: go test -race -timeout 100m ./...
