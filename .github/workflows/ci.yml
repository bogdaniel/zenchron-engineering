name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # T2 (#516 Stage 7, ADR-0007): the full suite, on every push to main only. This
  # is the exact-revision evidence the trusted-main resolver accepts (check "go",
  # GitHub Actions, workflow ci.yml, event push, branch main), so its name, its
  # command and its trigger must not change. A pull request is gated by the
  # evidence jobs below instead; docs/ci-stage7-migration.md gives the order the
  # ruleset and this condition must change in.
  go:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Static evidence (T0)
        run: ci/static.sh

      - name: Test
        # Keep the unpartitioned full suite and its package bound. JSON records
        # retain every test's start, result and elapsed time in the downloadable
        # job log, including failure-only fixture diagnostics and panic stacks.
        # A package alarm's current test does not identify accumulated suite cost.
        # 45m, not 30m: the runtime package alone takes about 25 minutes on a hosted
        # runner, so a slow runner failed an unchanged suite (#656). Only the bound
        # changed; no test is skipped, sharded or retried.
        run: go test -json -timeout 45m ./...

  # T0 + T1 (#516): static evidence, then the behavioral evidence that
  # ci/evidence/registry.json selects for what this pull request changed. With
  # the race aggregate below it is the pull-request merge gate; the full suite
  # above runs after the merge.
  #
  # The evidence runs as parallel jobs whose union is what `go run ./ci/evidence`
  # runs on one machine: T0, every package but runtime, and the selected runtime
  # tests split by name across isolated runners. The `evidence` check a ruleset
  # requires is the aggregate of all of them, so it cannot pass while a part is
  # failed, cancelled or skipped.
  evidence-static:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Static evidence (T0)
        run: ci/static.sh

  evidence-packages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Every package but runtime (T1)
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: go run ./ci/evidence -packages -base "$BASE_REF"

  evidence-runtime:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Selected runtime tests (T1)
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: go run ./ci/evidence -shard "${{ matrix.shard }}/4" -base "$BASE_REF"

  # Preserve the check identity and fail on ANY failed/cancelled/skipped part.
  evidence:
    if: always() && github.event_name == 'pull_request'
    needs: [evidence-static, evidence-packages, evidence-runtime]
    runs-on: ubuntu-latest
    steps:
      - name: All T0 and T1 evidence must pass
        run: test "${{ needs.evidence-static.result }}" = success && test "${{ needs.evidence-packages.result }}" = success && test "${{ needs.evidence-runtime.result }}" = success

  # The -race escalation of high-risk domains the same plan selects. It is a
  # separate job because it is about four times slower than the plain run.
  evidence-race-parts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: High-risk race escalation (T1)
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: go run ./ci/evidence -race -race-shard "${{ matrix.shard }}/8" -base "$BASE_REF"

  # Preserve the check identity and fail on ANY failed/cancelled/skipped part.
  # Independent runners bound aggregate serial cost without dropping tests or
  # changing the per-package race timeout. T2 and the full T3 sweep stay intact.
  evidence-race:
    if: always() && github.event_name == 'pull_request'
    needs: evidence-race-parts
    runs-on: ubuntu-latest
    steps:
      - name: All selected race evidence must pass
        run: test "${{ needs.evidence-race-parts.result }}" = success
