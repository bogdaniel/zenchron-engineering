name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      # A build-tagged file that no CI job compiles rots invisibly:
      # control_endpoint_other.go referenced an undefined identifier and both
      # Linux and macOS jobs stayed green, because neither ever selects that
      # build tag. Compiling for a non-unix target is what makes the refusal
      # path a checked one.
      - name: Cross-compile the non-unix build
        run: GOOS=windows GOARCH=amd64 go build ./...

      - name: Test
        # The runtime package runs about six minutes and grows with every
        # slice, against Go's IMPLICIT ten-minute per-package default. That
        # default turns a slow runner into a red required check for no protocol
        # reason - it happened once already, and the re-run passed unchanged.
        #
        # The bound is deliberately generous rather than tight: its job is to
        # catch a hang, not to police how long the suite takes. A timeout set
        # close to the current duration would be a second, silent performance
        # budget that fails as tests are added, which is the failure being
        # fixed here.
        run: go test -timeout 30m ./...
