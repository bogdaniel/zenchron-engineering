name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Static evidence (T0)
        run: ci/static.sh

      - name: Test
        # Keep the unpartitioned full suite and its package bound. JSON records
        # retain every test's start, result and elapsed time in the downloadable
        # job log, including failure-only fixture diagnostics and panic stacks.
        # A package alarm's current test does not identify accumulated suite cost.
        # 45m, not 30m: the runtime package alone takes about 25 minutes on a hosted
        # runner, so a slow runner failed an unchanged suite (#656). Only the bound
        # changed; no test is skipped, sharded or retried.
        run: go test -json -timeout 45m ./...

  # T0 + T1 (#516): static evidence, then the behavioral evidence that
  # ci/evidence/registry.json selects for what this pull request changed. It
  # runs beside the full suite above, which stays the required merge gate until
  # trusted-main adoption no longer reads "every commit on main passed it".
  evidence:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Static evidence (T0)
        run: ci/static.sh

      - name: Impact-directed evidence (T1)
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: go run ./ci/evidence -base "$BASE_REF"

  # The -race escalation of high-risk domains the same plan selects. It is a
  # separate job because it is about four times slower than the plain run.
  evidence-race-parts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: High-risk race escalation (T1)
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: go run ./ci/evidence -race -race-shard "${{ matrix.shard }}/4" -base "$BASE_REF"

  # Preserve the check identity and fail on ANY failed/cancelled/skipped part.
  # Independent runners bound aggregate serial cost without dropping tests or
  # changing the per-package race timeout. T2 and the full T3 sweep stay intact.
  evidence-race:
    if: always() && github.event_name == 'pull_request'
    needs: evidence-race-parts
    runs-on: ubuntu-latest
    steps:
      - name: All selected race evidence must pass
        run: test "${{ needs.evidence-race-parts.result }}" = success
