name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Static evidence (T0)
        run: ci/static.sh

      - name: Test
        # The runtime package runs about six minutes and grows with every
        # slice, against Go's IMPLICIT ten-minute per-package default. That
        # default turns a slow runner into a red required check for no protocol
        # reason - it happened once already, and the re-run passed unchanged.
        #
        # The bound is deliberately generous rather than tight: its job is to
        # catch a hang, not to police how long the suite takes. A timeout set
        # close to the current duration would be a second, silent performance
        # budget that fails as tests are added, which is the failure being
        # fixed here.
        run: go test -timeout 30m ./...

  # T0 + T1 (#516): static evidence, then the behavioral evidence that
  # ci/evidence/registry.json selects for what this pull request changed. It
  # runs beside the full suite above, which stays the required merge gate until
  # trusted-main adoption no longer reads "every commit on main passed it".
  evidence:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Static evidence (T0)
        run: ci/static.sh

      - name: Impact-directed evidence (T1)
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: go run ./ci/evidence -base "$BASE_REF"

  # The -race escalation of high-risk domains the same plan selects. It is a
  # separate job because it is about four times slower than the plain run.
  evidence-race:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: High-risk race escalation (T1)
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: go run ./ci/evidence -race -base "$BASE_REF"
