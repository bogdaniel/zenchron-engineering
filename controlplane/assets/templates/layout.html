{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{block "title" .Data}}control plane{{end}} :: zenchron-engineering</title>
<link rel="stylesheet" href="/static/console.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/overview">zenchron-engineering</a>
  <nav>
    <a href="/overview">overview</a>
    <a href="/runs">runs</a>
    <a href="/products">products</a>
    <a href="/workgraphs">work graphs</a>
  </nav>
  <span id="live-indicator" class="live stale" role="status" title="server snapshot; live refresh not confirmed">snapshot</span>
  <span id="freshness" class="muted" data-observed-at="{{.ObservedAt.UTC.Format "2006-01-02T15:04:05Z"}}">observed {{.ObservedAt.UTC.Format "15:04:05"}}Z</span>
</header>
<main>
{{template "content" .Data}}
</main>
<dialog id="action-dialog" aria-labelledby="action-title">
  <h2 id="action-title">confirm operator action</h2>
  <table class="kv">
    <tr><th>target</th><td class="mono" id="action-target"></td></tr>
    <tr><th>controller</th><td class="mono" id="action-generation"></td></tr>
  </table>
  <p id="action-consequence"></p>
  <p id="action-note-field" hidden><label for="action-note">note (optional)</label><br><textarea id="action-note" rows="2" maxlength="500"></textarea></p>
  <p id="action-result" role="status" aria-live="polite"></p>
  <p><button type="button" id="action-confirm" class="action">confirm</button> <button type="button" id="action-close">close</button></p>
</dialog>
<script src="/static/console.js"></script>
</body>
</html>
{{end}}
